<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Limon — İlk animasyon</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#282819;background:#fff}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center}.wrap{padding:20px;max-width:700px;width:100%;text-align:center}h1{margin:0;font-size:27px}p{margin:8px 0 12px;color:#6e6e54}.scene{width:min(100%,540px);margin:0 auto;aspect-ratio:384/418;background:#fff;overflow:hidden}canvas{display:block;width:100%;height:100%}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}button{font-size:16px;font-weight:650;background:#ffe363;border:1px solid #d6b72b;border-radius:12px;padding:12px 18px;cursor:pointer;color:#34311f}button:focus-visible{outline:3px solid #888}button.alt{background:white;border-color:#ddd}.status{min-height:25px;font-size:14px;color:#656545;margin-top:12px}.foot{font-size:12px;color:#888;line-height:1.5;margin:14px auto;max-width:560px}
</style></head>
<body><main class="wrap"><h1>🍋 Merhaba, ben Limon!</h1><p>İlk yüz animasyonumuz · Orijinal karakter korunmuştur</p><div class="scene"><canvas id="face" width="384" height="418" aria-label="Limon yüz animasyonu"></canvas></div><div class="buttons"><button id="animate">〰️ Zikzak konuşma</button><button id="say">🔊 Limon konuşsun</button><button id="blink" class="alt">😉 Göz kırp</button><button id="stop" class="alt">⏹ Durdur</button></div><div class="status" id="status">Limon dinliyor.</div><div class="foot">Bu, seçtiğin ifade kartlarının karelerini kullanan görsel prototiptir. Henüz mikrofon veya yapay zekâ bağlantısı yok. Türkçe ses, Mac'teki tarayıcının seslendirme motorundan gelir.</div></main>
<script>
const c=document.getElementById('face'),ctx=c.getContext('2d'),statusEl=document.getElementById('status');
const sprite=new Image();sprite.src='Limon Karakteri İfade Kartları.png';
// Original 1536 x 1024 sheet. Top-row panels are 384px wide; bottom-row images start at y=512.
const coords={idle:[0,0],talk1:[384,0],talk2:[768,0],talk3:[1152,0],blink:[384,512],happy:[768,512]};
let state='idle',active=false,cycle=0,tick=null,stopTimer=null,utterance=null;
function draw(which){if(!sprite.complete||!sprite.naturalWidth)return;const [x,y]=coords[which];ctx.clearRect(0,0,384,418);ctx.drawImage(sprite,x,y,384,418,0,0,384,418)}
sprite.onload=()=>draw('idle');
function render(which){state=which;draw(state)}
function stop(){active=false;clearInterval(tick);clearTimeout(stopTimer);if('speechSynthesis' in window)speechSynthesis.cancel();render('idle');statusEl.textContent='Limon dinliyor.'}
function animate(duration=5000){stop();active=true;statusEl.textContent='Limon konuşuyor…';const f=['talk1','talk2','talk3','talk2','talk1'];let i=0;tick=setInterval(()=>{render(f[i%f.length]);i++},155);if(duration)stopTimer=setTimeout(stop,duration)}
document.getElementById('animate').onclick=()=>animate(5000);
document.getElementById('blink').onclick=()=>{stop();render('blink');stopTimer=setTimeout(()=>render('idle'),850)};
document.getElementById('stop').onclick=stop;
document.getElementById('say').onclick=()=>{const msg='Merhaba! Ben Limon. Seninle tanıştığıma çok sevindim. Hadi bakalım, dişlerini birlikte sayalım mı?';if(!('speechSynthesis' in window)){statusEl.textContent='Bu tarayıcıda seslendirme yok; sessiz animasyonu dene.';return}animate(0);utterance=new SpeechSynthesisUtterance(msg);utterance.lang='tr-TR';utterance.rate=.9;utterance.pitch=1.25;const voices=speechSynthesis.getVoices();const turkish=voices.find(v=>v.lang.toLowerCase().startsWith('tr'));if(turkish)utterance.voice=turkish;utterance.onend=()=>stop();utterance.onerror=()=>{stop();statusEl.textContent='Ses oynatılamadı; sessiz animasyon düğmesi çalışır.'};speechSynthesis.speak(utterance);stopTimer=setTimeout(stop,18000)};
</script></body></html>
